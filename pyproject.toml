[project]
name = "pdomain-index-pip-tools"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "actionlint-py>=1.7.12.24",
    "basedpyright>=1.39.4",
    "mdformat>=0.7.22",
    "mdformat-frontmatter>=2.1.2",
    "pytest>=8.3",
    "ruff>=0.15.13",
    "shellcheck-py>=0.11.0.1",
]

[tool.uv]
required-version = ">=0.11.16"
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "ANN",
    "B",
    "E",
    "F",
    "I",
    "RUF",
    "S",
    "SIM",
    "T20",
    "UP",
    "W",
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = [
    # Maintenance scripts report command-line progress and results on stdout.
    "T201",
    # S603: subprocesses use fixed argument vectors or a shutil.which-resolved executable.
    "S603",
    # S607: regen_index intentionally resolves the trusted gh CLI from PATH.
    "S607",
]
"tests/**/*.py" = [
    # pytest uses assert statements.
    "S101",
]

[tool.basedpyright]
include = ["scripts", "tests"]
exclude = ["**/__pycache__", "**/.venv"]
typeCheckingMode = "recommended"
failOnWarnings = true
# venvPath/venv are deliberately unset. This workspace names its environment
# ".venv-container" via UV_PROJECT_ENVIRONMENT, so a hardcoded ".venv" silently
# resolves a stale environment: after any merge that changes uv.lock, every new
# third-party symbol reports as a missing attribute until .venv is re-synced.
# Run under `uv run` and basedpyright resolves from the active interpreter.
# Matches pdomain-book-tools, pdomain-ocr-labeler-spa and pdomain-pgdp-measure,
# which unset these for the same reason.

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config"]
pythonpath = ["."]
